<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Generiši ikonice</title>
    <style>
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 20px;
        }
        h1 { font-size: 20px; }
        canvas { border: 1px solid #333; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        #status { color: #4ade80; font-size: 14px; }
    </style>
</head>
<body>
    <h1>Generisanje PWA ikonica</h1>
    <p>Klikni dugme da generišeš sve ikonice</p>
    <button class="btn" id="generateBtn">Generiši i preuzmi</button>
    <div id="status"></div>
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const svgUrl = './icon.svg';

        document.getElementById('generateBtn').addEventListener('click', async () => {
            const status = document.getElementById('status');
            const resp = await fetch(svgUrl);
            const svgText = await resp.text();

            for (const size of sizes) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const img = new Image();
                const blob = new Blob([svgText], { type: 'image/svg+xml' });
                const url = URL.createObjectURL(blob);

                await new Promise((resolve) => {
                    img.onload = () => {
                        ctx.drawImage(img, 0, 0, size, size);
                        URL.revokeObjectURL(url);

                        canvas.toBlob((pngBlob) => {
                            const a = document.createElement('a');
                            a.href = URL.createObjectURL(pngBlob);
                            a.download = `icon-${size}.png`;
                            a.click();
                            URL.revokeObjectURL(a.href);
                            resolve();
                        }, 'image/png');
                    };
                    img.src = url;
                });

                status.textContent = `Generisano: icon-${size}.png`;
                await new Promise(r => setTimeout(r, 200));
            }

            status.textContent = 'Sve ikonice su generisane! Premesti ih u folder sa kalendarom.';
        });
    </script>
</body>
</html>
